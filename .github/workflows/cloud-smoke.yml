name: Partial migration smoke test (no market monitoring)
on:
  push:
    branches: [cloud-monitor-migration-20261030]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cloud-validation-state
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read isolated validation-record branch
        uses: actions/checkout@v4
        with:
          ref: cloud-validation-state
          path: validation-state
      - name: Find previous run
        id: previous
        run: python tools/previous_run.py
      - name: Retrieve previous partial snapshot if available
        if: steps.previous.outputs.run_id != ''
        id: previous_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: partial-research-snapshot
          path: previous-run/
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Check previous artifact hashes
        if: steps.previous_artifact.outcome == 'success'
        run: |
          if ! (cd previous-run && sha256sum -c SHA256.txt); then
            mv previous-run previous-invalid
            echo 'Previous artifact hash mismatch; comparison will be blocked.'
          fi
      - name: Check Node version
        run: node --version
      - name: Test quote gate and immutable output using synthetic inputs
        run: node tools/cloud_calculate_test.mjs
      - name: Test date and source parsers with synthetic inputs
        run: python tools/cloud_snapshot_test.py
      - name: Test research-only date-level calculations
        run: node tools/research_daily_test.mjs
      - name: Test frozen-history overlap and risk states
        run: node tools/etf_risk_test.mjs
      - name: Test estimate and macro review barriers
        run: python tools/fundamental_review_test.py
      - name: Test dated direct-equity overlap boundaries
        run: python tools/holdings_overlap_test.py
      - name: Test comparable runs and methodology changes
        run: python tools/compare_runs_test.py
      - name: Test issuer feed discovery boundaries
        run: python tools/issuer_feed_test.py
      - name: Test declared ETF scenario gates
        run: node tools/etf_scenarios_test.mjs
      - name: Check existing core math
        run: node tools/core_check.mjs
      - name: Probe public endpoints (availability only)
        run: python tools/source_probe.py source-probe.json
      - name: Acquire dated partial research snapshot
        run: python tools/cloud_snapshot.py partial-run
      - name: Run quote-gated stock model (blocked inputs remain blocked)
        run: node tools/cloud_calculate.mjs partial-run/model-input.json partial-run/partial-model-result.json
      - name: Run explicitly provisional date-level scenarios
        run: node tools/research_daily.mjs partial-run/snapshot.json partial-run/research-only.json
      - name: Flag financial estimate changes and review macro transmission
        run: python tools/fundamental_review.py partial-run/snapshot.json partial-run/fundamental-review.json
      - name: Discover unreviewed issuer release candidates
        run: python tools/issuer_feed.py previous-run/issuer-feed.json partial-run/issuer-feed.json
      - name: Compute frozen-snapshot direct equity overlap
        run: python tools/holdings_overlap.py partial-run/holdings-overlap.json
      - name: Evaluate declared ETF scenarios or report missing inputs
        run: node tools/etf_scenarios.mjs tools/fund-scenarios-empty.json partial-run/etf-scenarios.json
      - name: Compare with previous run if methodology is unchanged
        run: python tools/compare_runs.py partial-run previous-run partial-run/comparison.json
      - name: Hash and verify generated files
        run: cd partial-run && sha256sum snapshot.json model-input.json partial-model-result.json research-only.json fundamental-review.json issuer-feed.json holdings-overlap.json etf-scenarios.json comparison.json > SHA256.txt && sha256sum -c SHA256.txt
      - name: Preserve source-probe metadata
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-metadata
          path: source-probe.json
          if-no-files-found: error
      - name: Preserve partial research snapshot temporarily
        uses: actions/upload-artifact@v4
        with:
          name: partial-research-snapshot
          path: partial-run/
          if-no-files-found: error
      - name: Read back saved partial snapshot
        uses: actions/download-artifact@v4
        with:
          name: partial-research-snapshot
          path: readback/
      - name: Check downloaded snapshot hash
        run: cd readback && sha256sum -c SHA256.txt
      - name: Write minimal dated validation record
        run: python tools/public_run_record.py partial-run/snapshot.json "validation-state/cloud-runs/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Commit, push and read back validation record
        working-directory: validation-state
        run: |
          record="cloud-runs/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cp "$record" cloud-runs/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$record" cloud-runs/latest.json
          git commit -m "Record partial cloud validation ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/cloud-validation-state
          git fetch origin cloud-validation-state
          git show "origin/cloud-validation-state:$record" > readback-record.json
          test "$(sha256sum "$record" | cut -d' ' -f1)" = "$(sha256sum readback-record.json | cut -d' ' -f1)"
          git show origin/cloud-validation-state:cloud-runs/latest.json > readback-latest.json
          test "$(sha256sum cloud-runs/latest.json | cut -d' ' -f1)" = "$(sha256sum readback-latest.json | cut -d' ' -f1)"
          echo 'Public minimal validation record saved and read back with matching hash.'
      - name: Explain coverage
        run: echo 'Partial synthetic smoke and source accessibility only; no full model, site publishing, schedule, or investment validity verified.'
